# CI — the same gate CLAUDE.md requires locally (typecheck + build), plus the
# committed Layer-0 tests (pure-lib invariants + the MCP tool contract). All
# deterministic, no model calls, no engine required — the Tonality bridge is an
# optional sidecar and is not exercised here.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
